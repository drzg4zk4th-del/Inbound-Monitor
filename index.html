<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Incoming Shipment Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
padding:30px;
}

h1{
margin-top:0;
font-size:38px;
margin-bottom:25px;
}

.dashboard-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#111827;
padding:20px;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

.card h2{
margin-top:0;
font-size:18px;
color:#9ca3af;
}

.big-number{
font-size:38px;
font-weight:bold;
margin-top:10px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:25px;
}

input,
select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
font-size:15px;
}

input:focus,
select:focus{
outline:none;
border:2px solid #2563eb;
}

button{
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:15px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
border-radius:16px;
overflow:hidden;
}

th{
background:#1f2937;
padding:14px;
text-align:left;
font-size:14px;
}

td{
padding:12px;
border-top:1px solid #374151;
font-size:14px;
}

td[contenteditable="true"]{
background:#111827;
}

td[contenteditable="true"]:focus{
outline:2px solid #2563eb;
}

.delete-btn{
background:#dc2626;
padding:8px 12px;
border-radius:8px;
}

.delete-btn:hover{
background:#b91c1c;
}

.warning{
background:#7f1d1d !important;
}

.status-select{
background:#374151;
padding:8px;
border-radius:8px;
border:none;
color:white;
}

.small-text{
color:#9ca3af;
margin-top:8px;
font-size:14px;
}

</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

<h1>Incoming Shipment Planner</h1>

<div class="dashboard-grid">

<div class="card">
<h2>Total Shipments</h2>
<div class="big-number" id="totalShipments">0</div>
</div>

<div class="card">
<h2>Total Estimated Pallets</h2>
<div class="big-number" id="totalPallets">0</div>
</div>

<div class="card">
<h2>Incoming This Week</h2>
<div class="big-number" id="incomingWeek">0</div>
</div>

<div class="card">
<h2>Arrived Shipments</h2>
<div class="big-number" id="arrivedCount">0</div>
</div>

</div>

<div class="card">

<div class="form-grid">

<input type="text" id="poInput" placeholder="PO Number">

<input type="text" id="skuInput" placeholder="SKU">

<input type="text" id="styleInput" placeholder="Style">

<input type="text" id="colourInput" placeholder="Colour">

<input type="date" id="etaInput">

<input type="text" id="dispatchWeekInput" placeholder="Dispatch Week">

<input type="number" id="palletInput" placeholder="Estimated Pallets">

<select id="poTypeInput">
<option value="Repeat">Repeat</option>
<option value="New">New</option>
</select>

<input type="text" id="locationInput" placeholder="Storage Location">

</div>

<button onclick="addShipment()">Add Shipment</button>

</div>

<br>

<table id="shipmentTable">

<tr>
<th>PO</th>
<th>SKU</th>
<th>Style</th>
<th>Colour</th>
<th>ETA</th>
<th>Dispatch Week</th>
<th>Est Pallets</th>
<th>PO Type</th>
<th>Storage Location</th>
<th>Status</th>
<th>Delete</th>
</tr>

</table>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD9nPDHQpkPgxeQYfe-JVWemQg6CjbCBYM",
  authDomain: "seven-hills-dashboard-e973d.firebaseapp.com",
  projectId: "seven-hills-dashboard-e973d",
  storageBucket: "seven-hills-dashboard-e973d.firebasestorage.app",
  messagingSenderId: "1016653351453",
  appId: "1:1016653351453:web:a2a1f597844adf51ba54f4"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

function addShipment(){

const po = document.getElementById('poInput').value;
const sku = document.getElementById('skuInput').value;
const style = document.getElementById('styleInput').value;
const colour = document.getElementById('colourInput').value;
const eta = document.getElementById('etaInput').value;
const dispatchWeek = document.getElementById('dispatchWeekInput').value;
const pallets = document.getElementById('palletInput').value;
const poType = document.getElementById('poTypeInput').value;
const location = document.getElementById('locationInput').value;

const row = document.getElementById('shipmentTable').insertRow();

row.innerHTML = `
<td contenteditable="true">${po}</td>
<td contenteditable="true">${sku}</td>
<td contenteditable="true">${style}</td>
<td contenteditable="true">${colour}</td>
<td contenteditable="true">${eta}</td>
<td contenteditable="true">${dispatchWeek}</td>
<td contenteditable="true">${pallets}</td>
<td contenteditable="true">${poType}</td>
<td contenteditable="true">${location}</td>

<td>
<select class="status-select">
<option>In Transit</option>
<option>Arrived</option>
</select>
</td>

<td>
<button class="delete-btn">Delete</button>
</td>
`;

setupRow(row);

refreshDashboard();
saveAll();
clearInputs();

}

function setupRow(row){

row.querySelectorAll('td[contenteditable="true"]').forEach(cell=>{

cell.addEventListener('input',()=>{

refreshDashboard();
saveAll();

});

});

const select = row.querySelector('select');

select.addEventListener('change',()=>{

refreshDashboard();
saveAll();

});

const deleteBtn = row.querySelector('.delete-btn');

deleteBtn.addEventListener('click',()=>{

row.remove();

refreshDashboard();
saveAll();

});

}

function clearInputs(){

document.getElementById('poInput').value='';
document.getElementById('skuInput').value='';
document.getElementById('styleInput').value='';
document.getElementById('colourInput').value='';
document.getElementById('etaInput').value='';
document.getElementById('dispatchWeekInput').value='';
document.getElementById('palletInput').value='';
document.getElementById('locationInput').value='';

}

function refreshDashboard(){

let totalShipments = 0;
let totalPallets = 0;
let incomingWeek = 0;
let arrivedCount = 0;

const rows = document.querySelectorAll('#shipmentTable tr');

rows.forEach((row,index)=>{

if(index===0)return;

totalShipments++;

const pallets = Number(row.cells[6].innerText || 0);
totalPallets += pallets;

const status = row.cells[9].querySelector('select').value;

if(status === 'Arrived'){
arrivedCount++;
}

const etaText = row.cells[4].innerText;

row.classList.remove('warning');

if(etaText){

const etaDate = new Date(etaText);
const today = new Date();

etaDate.setHours(0,0,0,0);
today.setHours(0,0,0,0);

const diffDays = (etaDate - today) / (1000 * 60 * 60 * 24);

if(diffDays <= 7 && diffDays >= 0 && status === 'In Transit'){

row.classList.add('warning');
incomingWeek++;

}

}

});

document.getElementById('totalShipments').innerText = totalShipments;
document.getElementById('totalPallets').innerText = totalPallets;
document.getElementById('incomingWeek').innerText = incomingWeek;
document.getElementById('arrivedCount').innerText = arrivedCount;

}

async function saveAll(){

const shipments = [];

document.querySelectorAll('#shipmentTable tr').forEach((row,index)=>{

if(index===0)return;

const cells = row.querySelectorAll('td');

shipments.push({

po: cells[0].innerText,
sku: cells[1].innerText,
style: cells[2].innerText,
colour: cells[3].innerText,
eta: cells[4].innerText,
dispatchWeek: cells[5].innerText,
pallets: cells[6].innerText,
poType: cells[7].innerText,
location: cells[8].innerText,
status: cells[9].querySelector('select').value

});

});

await db.collection("incomingShipments").doc("main").set({
shipments
});

}

async function loadAll(){

const snapshot = await db.collection("incomingShipments").doc("main").get();

if(!snapshot.exists)return;

const data = snapshot.data();

if(!data.shipments)return;

data.shipments.forEach(item=>{

const row = document.getElementById('shipmentTable').insertRow();

row.innerHTML = `
<td contenteditable="true">${item.po}</td>
<td contenteditable="true">${item.sku}</td>
<td contenteditable="true">${item.style}</td>
<td contenteditable="true">${item.colour}</td>
<td contenteditable="true">${item.eta}</td>
<td contenteditable="true">${item.dispatchWeek}</td>
<td contenteditable="true">${item.pallets}</td>
<td contenteditable="true">${item.poType}</td>
<td contenteditable="true">${item.location}</td>

<td>
<select class="status-select">
<option ${item.status === 'In Transit' ? 'selected' : ''}>In Transit</option>
<option ${item.status === 'Arrived' ? 'selected' : ''}>Arrived</option>
</select>
</td>

<td>
<button class="delete-btn">Delete</button>
</td>
`;

setupRow(row);

});

refreshDashboard();

}

window.onload = async function(){

await loadAll();

refreshDashboard();

}

</script>

</body>

</html>
