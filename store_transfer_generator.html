<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Console Transfer Label Generator</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px;background:#111827;border-bottom:1px solid #374151}
button{padding:10px 16px;border:none;border-radius:8px;background:#8b6b3f;color:white;cursor:pointer}
.main{padding:20px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;margin-bottom:20px}
.card{background:#1f2937;border-radius:14px;padding:18px}
.big{font-size:34px;font-weight:bold;margin-top:10px}
.section{background:#1f2937;border-radius:14px;padding:18px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:8px;
    border-bottom:1px solid #374151;
    text-align:left;
}

th{
    background:#111827;
}
@media(max-width:1200px){
.metrics{grid-template-columns:repeat(3,1fr)}
}

input,
select{

width:100%;

padding:10px;

margin:8px 0 15px;

box-sizing:border-box;

border-radius:8px;

border:1px solid #374151;

background:#111827;

color:white;

}


@media print{
body *{visibility:hidden!important;}
#printLabel,#printLabel *{visibility:visible!important;}
#printLabel{
position:absolute;
left:0;
top:0;
width:150mm;
height:100mm;
background:white;
color:black;
padding:8mm;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
#printLabel .heading{font-size:11pt;font-weight:bold;margin-top:3mm;}
#printLabel .value{font-size:22pt;font-weight:bold;margin-bottom:4mm;}
#printLabel .contents{border-top:2px solid #000;padding-top:4mm;white-space:pre-wrap;font-size:14pt;}
@page{size:150mm 100mm;margin:0;}
}

@page{
    size:150mm 100mm;
    margin:0;
}

body{
    margin:0;
    padding:6mm;
    font-family:Arial,sans-serif;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:8mm;
    margin-bottom:3mm;
}

.col{
    flex:1;
}

.heading{
    font-size:8pt;
    font-weight:bold;
    margin-bottom:1mm;
}

.store{
    font-size:13pt;
    font-weight:bold;
    line-height:1.1;
    word-break:break-word;
}

.transfer{
    font-size:16pt;
    font-weight:bold;
    margin:2mm 0;
}

.list{
    border-top:2px solid #000;
    border-bottom:2px solid #000;
    padding:2mm 0;
    margin:3mm 0;
    font-size:10pt;
    line-height:1.15;
}

.total{
    font-size:11pt;
    font-weight:bold;
}
    
</style>
<script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyD9nPDHQpkPgxeQYfe-JVWemQg6CjbCBYM",
authDomain: "seven-hills-dashboard-e973d.firebaseapp.com",
projectId: "seven-hills-dashboard-e973d",
storageBucket: "seven-hills-dashboard-e973d.firebasestorage.app",
messagingSenderId: "1016653351453",
appId: "1:1016653351453:web:a2a1f597844adf51ba54f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let returnsData=[];
let transitData=[];

async function saveReturnsConsole(){

 const chunkSize = 500;

 const returnChunks = [];
 for(let i=0;i<returnsData.length;i+=chunkSize){
   returnChunks.push(returnsData.slice(i,i+chunkSize));
 }

 const transitChunks = [];
 for(let i=0;i<transitData.length;i+=chunkSize){
   transitChunks.push(transitData.slice(i,i+chunkSize));
 }

 await db.collection('storeReturnsConsole').doc('metadata').set({
   returnChunks:returnChunks.length,
   transitChunks:transitChunks.length,
   lastUpdated:new Date().toISOString()
 });

 for(let i=0;i<returnChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('returns_'+i)
     .set({rows:returnChunks[i]});
 }

 for(let i=0;i<transitChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('transit_'+i)
     .set({rows:transitChunks[i]});
 }

 console.log('Firebase chunked save successful');
}

async function loadReturnsConsole(){

 returnsData=[];
 transitData=[];

 const meta =
 await db.collection('storeReturnsConsole')
 .doc('metadata')
 .get();

 if(!meta.exists) return;

 const m = meta.data();

 const returnChunks = m.returnChunks || 0;
 const transitChunks = m.transitChunks || 0;

 for(let i=0;i<returnChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('returns_'+i)
   .get();

   if(snap.exists){
      returnsData.push(...(snap.data().rows||[]));
   }
 }

 for(let i=0;i<transitChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('transit_'+i)
   .get();

   if(snap.exists){
      transitData.push(...(snap.data().rows||[]));
   }
 }

 console.log('Chunked data loaded',
 returnsData.length,
 transitData.length);
}

window.addEventListener("load",async()=>{

await loadReturnsConsole();

populateStores();

});;

function populateStores(){

const stores=[...new Set(
returnsData.map(r=>r.store)
)].sort();

const from=document.getElementById("fromStore");
const to=document.getElementById("toStore");

stores.forEach(store=>{

from.innerHTML+=`<option>${store}</option>`;

if(store!=="Virtual Warehouse"){
    to.innerHTML+=`<option>${store}</option>`;
}

});

}

function loadStoreReturns(){

const store=document.getElementById("fromStore").value;

const body=document.querySelector("#styleTable tbody");

body.innerHTML="";

returnsData
.filter(r=>r.store===store)
.forEach((r,index)=>{

body.innerHTML+=`

<tr>

<td>

<input
type="checkbox"
class="pick">

</td>

<td>${r.style}</td>

<td>${r.colour}</td>

<td>${r.qty}</td>

<td>

<input
type="number"
value="${r.qty}"
min="0"
max="${r.qty}"
class="qty">

</td>

</tr>

`;

});

document.querySelectorAll(".pick,.qty").forEach(el=>{
    el.addEventListener("change",updateSummary);
    el.addEventListener("input",updateSummary);
});

updateSummary();

}

function updateSummary(){

let styles=0;

let units=0;

document
.querySelectorAll("#styleTable tbody tr")
.forEach(row=>{

const tick=row.querySelector(".pick");

const qty=row.querySelector(".qty");

if(tick.checked){

styles++;

units+=Number(qty.value);

}

});

document.getElementById("summary").innerHTML=`

<b>${styles}</b> Styles

<br>

<b>${units}</b> Units

`;

}

function filterStyles(){

const search=document.getElementById("searchStyle").value.toUpperCase();

document.querySelectorAll("#styleTable tbody tr").forEach(row=>{

const style=row.cells[1].innerText.toUpperCase();

row.style.display=
style.includes(search) ? "" : "none";

});

}

function generateTransfer(){
alert("Label ready. Click 'Print Carton Labels'.");
}

function printLabels(){

const transfer=document.getElementById("transferNumber").value.trim();
const from=document.getElementById("fromStore").value;
const to=document.getElementById("toStore").value;

let items=[];

document.querySelectorAll("#styleTable tbody tr").forEach(row=>{
 const tick=row.querySelector(".pick");
 if(!tick.checked) return;
 const style=row.cells[1].innerText;
 const colour=row.cells[2].innerText;
 const qty=row.querySelector(".qty").value;
 items.push(`${style} ${colour}<span>× ${qty}</span>`);
});

let font=40;
if(items.length>1) font=34;
if(items.length>2) font=30;
if(items.length>4) font=24;
if(items.length>6) font=20;
if(items.length>10) font=17;
if(items.length>14) font=15;

const p=window.open("","_blank");
p.document.write(`<!DOCTYPE html><html><head><title>Labels</title>
<style>
@page{size:150mm 100mm;margin:0}
body{margin:0;font-family:Arial}
.page{width:150mm;height:100mm;box-sizing:border-box;padding:8mm;page-break-after:always;display:flex;flex-direction:column;align-items:center;justify-content:center}
.page:last-child{page-break-after:auto}
.heading{font-size:12pt;font-weight:bold}
.store{font-size:24pt;font-weight:bold;margin-bottom:8mm;text-align:center}
#barcode{width:100%}
.item{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding:3mm 0;font-size:${font}pt;font-weight:bold}
span{margin-left:8mm}
</style></head><body>

<div class="page">
<div style="width:100%;text-align:center">
<div class="heading">FROM</div>
<div class="store">${from}</div>
<div class="heading">TO</div>
<div class="store">${to}</div>
<svg id="barcode"></svg>
</div>
</div>

<div class="page">
${items.map(i=>`<div class="item">${i}</div>`).join("")}
</div>

</body></html>`);
p.document.close();

JsBarcode(p.document.getElementById("barcode"),transfer,{
 format:"CODE128",
 width:3,
 height:70,
 displayValue:true,
 fontSize:20,
 margin:0
});

p.focus();
p.print();
setTimeout(()=>p.close(),500);

}

function printPackingList(){
    alert("Coming Soon");
}
</script>
</head>

<body>

<div class="header">
    <h1>📦 Store Transfer Generator</h1>
</div>

<div class="main">

<div class="section">

<h3>Transfer Details</h3>

<label>Transfer Number</label>
<input id="transferNumber">

<label>From Store</label>
<select id="fromStore" onchange="loadStoreReturns()">
    <option value="">Select Store</option>
</select>

<label>To Store</label>
<select id="toStore">
    <option value="Virtual Warehouse" selected>Virtual Warehouse</option>
</select>

</div>

<div class="section">

<h3>Available Returns</h3>

<input
id="searchStyle"
placeholder="Search Style..."
onkeyup="filterStyles()">

<table id="styleTable">

<thead>

<tr>

<th></th>

<th>Style</th>

<th>Colour</th>

<th>Qty</th>

<th>Transfer Qty</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<div class="section">

<h3>Summary</h3>

<div id="summary">

0 Styles

<br>

0 Units

</div>

</div>

<div class="section">

<button onclick="generateTransfer()">

Generate Transfer

</button>

<button onclick="printLabels()">

Print Carton Labels

</button>

<button onclick="printPackingList()">

Print Packing List

</button>

</div>

</div>


</body>
  
</html>
