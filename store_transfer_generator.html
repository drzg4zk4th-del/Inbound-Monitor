<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Transfer Label Generator</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px;background:#111827;border-bottom:1px solid #374151}
button{padding:10px 16px;border:none;border-radius:8px;background:#8b6b3f;color:white;cursor:pointer}
.main{padding:20px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;margin-bottom:20px}
.card{background:#1f2937;border-radius:14px;padding:18px}
.big{font-size:34px;font-weight:bold;margin-top:10px}
.section{background:#1f2937;border-radius:14px;padding:18px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:8px;
    border-bottom:1px solid #374151;
    text-align:left;
}

th{
    background:#111827;
}
@media(max-width:1200px){
.metrics{grid-template-columns:repeat(3,1fr)}
}

input,
select{

width:100%;

padding:10px;

margin:8px 0 15px;

box-sizing:border-box;

border-radius:8px;

border:1px solid #374151;

background:#111827;

color:white;

}

</style>
<script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyD9nPDHQpkPgxeQYfe-JVWemQg6CjbCBYM",
authDomain: "seven-hills-dashboard-e973d.firebaseapp.com",
projectId: "seven-hills-dashboard-e973d",
storageBucket: "seven-hills-dashboard-e973d.firebasestorage.app",
messagingSenderId: "1016653351453",
appId: "1:1016653351453:web:a2a1f597844adf51ba54f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let returnsData=[];
let transitData=[];

async function saveReturnsConsole(){

 const chunkSize = 500;

 const returnChunks = [];
 for(let i=0;i<returnsData.length;i+=chunkSize){
   returnChunks.push(returnsData.slice(i,i+chunkSize));
 }

 const transitChunks = [];
 for(let i=0;i<transitData.length;i+=chunkSize){
   transitChunks.push(transitData.slice(i,i+chunkSize));
 }

 await db.collection('storeReturnsConsole').doc('metadata').set({
   returnChunks:returnChunks.length,
   transitChunks:transitChunks.length,
   lastUpdated:new Date().toISOString()
 });

 for(let i=0;i<returnChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('returns_'+i)
     .set({rows:returnChunks[i]});
 }

 for(let i=0;i<transitChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('transit_'+i)
     .set({rows:transitChunks[i]});
 }

 console.log('Firebase chunked save successful');
}

async function loadReturnsConsole(){

 returnsData=[];
 transitData=[];

 const meta =
 await db.collection('storeReturnsConsole')
 .doc('metadata')
 .get();

 if(!meta.exists) return;

 const m = meta.data();

 const returnChunks = m.returnChunks || 0;
 const transitChunks = m.transitChunks || 0;

 for(let i=0;i<returnChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('returns_'+i)
   .get();

   if(snap.exists){
      returnsData.push(...(snap.data().rows||[]));
   }
 }

 for(let i=0;i<transitChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('transit_'+i)
   .get();

   if(snap.exists){
      transitData.push(...(snap.data().rows||[]));
   }
 }

 console.log('Chunked data loaded',
 returnsData.length,
 transitData.length);
}

window.addEventListener("load",async()=>{

await loadReturnsConsole();

populateStores();

});;

function populateStores(){

const stores=[...new Set(
returnsData.map(r=>r.store)
)].sort();

const from=document.getElementById("fromStore");
const to=document.getElementById("toStore");

stores.forEach(store=>{

from.innerHTML+=`<option>${store}</option>`;

if(store!=="Virtual Warehouse"){
    to.innerHTML+=`<option>${store}</option>`;
}

});

}

function loadStoreReturns(){

const store=document.getElementById("fromStore").value;

const body=document.querySelector("#styleTable tbody");

body.innerHTML="";

returnsData
.filter(r=>r.store===store)
.forEach((r,index)=>{

body.innerHTML+=`

<tr>

<td>

<input
type="checkbox"
class="pick">

</td>

<td>${r.style}</td>

<td>${r.colour}</td>

<td>${r.qty}</td>

<td>

<input
type="number"
value="${r.qty}"
min="0"
max="${r.qty}"
class="qty">

</td>

</tr>

`;

});

document.querySelectorAll(".pick,.qty").forEach(el=>{
    el.addEventListener("change",updateSummary);
    el.addEventListener("input",updateSummary);
});

updateSummary();

}

function updateSummary(){

let styles=0;

let units=0;

document
.querySelectorAll("#styleTable tbody tr")
.forEach(row=>{

const tick=row.querySelector(".pick");

const qty=row.querySelector(".qty");

if(tick.checked){

styles++;

units+=Number(qty.value);

}

});

document.getElementById("summary").innerHTML=`

<b>${styles}</b> Styles

<br>

<b>${units}</b> Units

`;

}

function filterStyles(){

const search=document.getElementById("searchStyle").value.toUpperCase();

document.querySelectorAll("#styleTable tbody tr").forEach(row=>{

const style=row.cells[1].innerText.toUpperCase();

row.style.display=
style.includes(search) ? "" : "none";

});

}

function generateTransfer(){
alert("Label ready. Click 'Print Carton Labels'.");
}

function printLabels(){

const transfer=document.getElementById("transferNumber").value;
const from=document.getElementById("fromStore").value;
const to=document.getElementById("toStore").value;
const contents=document.getElementById("contents").value;

const w=window.open("","","width=900,height=700");

w.document.write(`
<html>
<head>
<title>Print Label</title>
<style>
@page{size:150mm 100mm;margin:5mm;}
body{font-family:Arial;margin:0;padding:0;}
.label{width:140mm;height:90mm;border:2px solid #000;padding:8mm;box-sizing:border-box;}
h1{font-size:18pt;margin:0 0 8mm 0;}
.big{font-size:22pt;font-weight:bold;margin-bottom:6mm;}
.section{font-size:13pt;margin-bottom:6mm;}
.contents{white-space:pre-wrap;font-size:13pt;border-top:1px solid #000;padding-top:5mm;}
</style>
</head>
<body onload="window.print();window.close();">
<div class="label">
<h1>STORE TRANSFER</h1>
<div class="section"><b>FROM</b><br><div class="big">${from}</div></div>
<div class="section"><b>TO</b><br><div class="big">${to}</div></div>
<div class="section"><b>TRANSFER NO</b><br><div class="big">${transfer}</div></div>
<div class="contents"><b>CONTENTS</b><br>${contents.replace(/\n/g,"<br>")}</div>
</div>
</body>
</html>`);
w.document.close();

}
function printLabels(){
    window.print();
}

function printPackingList(){
    alert("Coming Soon");
}
</script>
</head>

<body>

<div class="header">
    <h1>📦 Store Transfer Generator</h1>
</div>

<div class="main">

<div class="section">

<h3>Transfer Details</h3>

<label>Transfer Number</label>
<input id="transferNumber">

<label>From Store</label>
<select id="fromStore" onchange="loadStoreReturns()">
    <option value="">Select Store</option>
</select>

<label>To Store</label>
<select id="toStore">
    <option value="Virtual Warehouse" selected>Virtual Warehouse</option>
</select>

</div>

<div class="section">

<h3>Available Returns</h3>

<input
id="searchStyle"
placeholder="Search Style..."
onkeyup="filterStyles()">

<table id="styleTable">

<thead>

<tr>

<th></th>

<th>Style</th>

<th>Colour</th>

<th>Qty</th>

<th>Transfer Qty</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<div class="section">

<h3>Summary</h3>

<div id="summary">

0 Styles

<br>

0 Units

</div>

</div>

<div class="section">

<h3>Label Details</h3>

<label>Contents</label>
<textarea id="contents" rows="5" style="width:100%;padding:10px;border-radius:8px;background:#111827;color:white;border:1px solid #374151;box-sizing:border-box;" placeholder="Example:
8 Styles
34 Units"></textarea>

<p>This tool prints a standard 150 x 100 mm Zebra carton label.</p>

</div>

<div class="section">

<button onclick="generateTransfer()">

Generate Transfer

</button>

<button onclick="printLabels()">

Print Carton Labels

</button>

<button onclick="printPackingList()">

Print Packing List

</button>

</div>

</div>

</body>
  
</html>
