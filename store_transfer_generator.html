<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}

body *{visibility:hidden!important;}
#printLabel,#printLabel *{visibility:visible!important;}

position:absolute;
left:0;
top:0;
width:150mm;

background:white;

}
#printLabel .heading{font-size:11pt;font-weight:bold;margin-top:3mm;}
#printLabel .value{font-size:22pt;font-weight:bold;margin-bottom:4mm;}
#printLabel .contents{border-top:2px solid #000;padding-top:4mm;white-space:pre-wrap;font-size:14pt;}
@page{size:150mm 100mm;margin:0;}
}

@page{
    size:150mm 100mm;
    margin:0;
}

body{
    margin:0;
    padding:6mm;
    font-family:Arial,sans-serif;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:8mm;
    margin-bottom:3mm;
}

.col{
    flex:1;
}

.heading{
    font-size:8pt;
    font-weight:bold;
    margin-bottom:1mm;
}

.store{
    font-size:13pt;
    font-weight:bold;
    line-height:1.1;

    border-top:2px solid #000;

</style>
<script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyD9nPDHQpkPgxeQYfe-JVWemQg6CjbCBYM",
authDomain: "seven-hills-dashboard-e973d.firebaseapp.com",
projectId: "seven-hills-dashboard-e973d",
storageBucket: "seven-hills-dashboard-e973d.firebasestorage.app",
messagingSenderId: "1016653351453",
appId: "1:1016653351453:web:a2a1f597844adf51ba54f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let returnsData=[];
let transitData=[];

async function saveReturnsConsole(){

 const chunkSize = 500;

 const returnChunks = [];
 for(let i=0;i<returnsData.length;i+=chunkSize){
   returnChunks.push(returnsData.slice(i,i+chunkSize));
 }

 const transitChunks = [];
 for(let i=0;i<transitData.length;i+=chunkSize){
   transitChunks.push(transitData.slice(i,i+chunkSize));
 }

 await db.collection('storeReturnsConsole').doc('metadata').set({
   returnChunks:returnChunks.length,
   transitChunks:transitChunks.length,
   lastUpdated:new Date().toISOString()
 });

 for(let i=0;i<returnChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('returns_'+i)
     .set({rows:returnChunks[i]});
 }

 for(let i=0;i<transitChunks.length;i++){
   await db.collection('storeReturnsConsole')
     .doc('transit_'+i)
     .set({rows:transitChunks[i]});
 }

 console.log('Firebase chunked save successful');
}

async function loadReturnsConsole(){

 returnsData=[];
 transitData=[];

 const meta =
 await db.collection('storeReturnsConsole')
 .doc('metadata')
 .get();

 if(!meta.exists) return;

 const m = meta.data();

 const returnChunks = m.returnChunks || 0;
 const transitChunks = m.transitChunks || 0;

 for(let i=0;i<returnChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('returns_'+i)
   .get();

   if(snap.exists){
      returnsData.push(...(snap.data().rows||[]));
   }
 }

 for(let i=0;i<transitChunks;i++){
   const snap = await db.collection('storeReturnsConsole')
   .doc('transit_'+i)
   .get();

   if(snap.exists){
      transitData.push(...(snap.data().rows||[]));
   }
 }

 console.log('Chunked data loaded',
 returnsData.length,
 transitData.length);
}

window.addEventListener("load",async()=>{

await loadReturnsConsole();

populateStores();

});;

function populateStores(){

    const from=document.getElementById("fromStore");
    const to=document.getElementById("toStore");

    from.innerHTML='<option value="">Select Store</option>';
    to.innerHTML='<option value="">Select Destination</option>';

    // Populate From stores
    [...new Set(returnsData.map(r=>r.store))]
        .sort()
        .forEach(store=>{
            from.innerHTML+=`<option value="${store}">${store}</option>`;
        });

    updateToStores();
}

function updateToStores(){

    const from=document.getElementById("fromStore").value;
    const to=document.getElementById("toStore");

    to.innerHTML='<option value="">Select Destination</option>';

    const destinations=[...new Set(
        returnsData
            .filter(r=>r.store===from)
            .map(r=>r.to)
    )]
    .filter(Boolean)
    .sort();

    destinations.forEach(store=>{
        to.innerHTML+=`<option value="${store}">${store}</option>`;
    });

    loadStoreReturns();
}


function buildPackString(r){
 const out=[];
 for(let i=4;i<=11;i++){
   const q=Number(r["s"+i]||0);
   if(q>0) out.push(`${i}×${q}`);
 }
 if(Number(r.os||0)>0) out.push(`OS×${r.os}`);
 return out.join(" ");
}


function loadStoreReturns(){

const fromStore=document.getElementById("fromStore").value;
const toStore=document.getElementById("toStore").value;

const body=document.querySelector("#styleTable tbody");

body.innerHTML="";

const filteredReturns=returnsData.filter(r=>
    r.store===fromStore &&
    r.to===toStore
);

filteredReturns.forEach((r,index)=>{

body.innerHTML+=`
<tr data-index="${index}" ${r.transferNumber?'style="background:#1f3b2d"':''}>
<td>${r.transferNumber||""}</td>
<td><input type="checkbox" class="pick" ${r.transferNumber?"disabled":""}></td>
<td>${r.style}</td>
<td>${r.colour}</td>
<td>${buildPackString(r)}</td>
</tr>
`;

});

document.querySelectorAll(".pick").forEach(el=>{
    el.addEventListener("change",updateSummary);
});

updateSummary();

}

function updateSummary(){

let styles=0;

let units=0;

document
.querySelectorAll("#styleTable tbody tr")
.forEach(row=>{

const tick=row.querySelector(".pick");



if(tick.checked){

styles++;

const idx=Number(row.dataset.index);
const filteredReturns=returnsData.filter(r=>
    r.store===document.getElementById("fromStore").value &&
    r.to===document.getElementById("toStore").value
);
const rec=filteredReturns[idx];
units+=Number(rec.qty||0);

}

});

document.getElementById("summary").innerHTML=`

<b>${styles}</b> Styles

<br>

<b>${units}</b> Units

`;

}

function filterStyles(){

const search=document.getElementById("searchStyle").value.toUpperCase();

document.querySelectorAll("#styleTable tbody tr").forEach(row=>{

const style=row.cells[2].innerText.toUpperCase();

row.style.display=
style.includes(search) ? "" : "none";

});

}

function generateTransfer(){
alert("Label ready. Click 'Print Carton Labels'.");
}

function printLabels(){

const transfer=document.getElementById("transferNumber").value.trim();
const from=document.getElementById("fromStore").value;
const to=document.getElementById("toStore").value;
let items=[];

document.querySelectorAll("#styleTable tbody tr").forEach(row=>{
 const tick=row.querySelector(".pick");
 if(!tick.checked) return;
 const idx=Number(row.dataset.index);
 const style=row.cells[2].innerText;
 const colour=row.cells[3].innerText;
 const filteredReturns=returnsData.filter(r=>
    r.store===from &&
    r.to===to
);
const rec=filteredReturns[idx];
const pack=buildPackString(rec);
items.push(`<div><b>${style} ${colour}</b><br>${pack}</div>`);
filteredReturns[idx].transferNumber=transfer;
});

saveReturnsConsole();

let font=Math.max(15,40-items.length*2);

const w=window.open("","_blank");
w.document.write(`<!doctype html><html><head><style>
@page{size:150mm 100mm;margin:0}
body{margin:0;font-family:Arial}
.page{width:150mm;height:100mm;display:flex;flex-direction:column;justify-content:center;align-items:center;page-break-after:always;padding:8mm;box-sizing:border-box}
.page:last-child{page-break-after:auto}
.store{font-size:24pt;font-weight:bold;text-align:center}
.item{font-size:${font}pt;font-weight:bold;border-bottom:2px solid #000;padding:3mm 0;line-height:1.5}
</style></head><body>
<div class='page'><div>FROM</div><div class='store'>${from}</div><div>TO</div><div class='store'>${to}</div><svg id='b'></svg></div>
${items.map(item=>`
<div class="page">
    <div class="item">${item}</div>
</div>
`).join("")}
</body></html>`);
w.document.close();
JsBarcode(w.document.getElementById("b"),transfer,{format:"CODE128",width:3,height:70,displayValue:true,fontSize:20});
w.print();
setTimeout(async()=>{
 w.close();
 await loadReturnsConsole();
 loadStoreReturns();
 document.getElementById("transferNumber").value="";
 document.getElementById("searchStyle").value="";
 document.getElementById("summary").innerHTML="<b>0</b> Styles<br><b>0</b> Units";
},500);
}

function printPackingList(){
    alert("Coming Soon");
}
</script>
</head>

<body>

<div class="header">
    <h1>Store Console Transfer Label Generato</h1>
</div>

<div class="main">

<div class="section">

<h3>Transfer Details</h3>

<label>Transfer Number</label>
<input id="transferNumber">

<label>From Store</label>
<select id="fromStore" onchange="updateToStores()">
    <option value="">Select Store</option>
</select>

<label>To Store</label>
<select id="toStore" onchange="loadStoreReturns()">
    <option value="Virtual Warehouse" selected>Virtual Warehouse</option>
</select>

</div>

<div class="section">

<h3>Available Returns</h3>

<input
id="searchStyle"
placeholder="Search Style..."
onkeyup="filterStyles()">

<table id="styleTable">

<thead>

<tr>

<th>Transfer</th>
<th></th>
<th>Style</th>

<th>Colour</th>

<th>Pack</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<div class="section">

<h3>Summary</h3>

<div id="summary">

0 Styles

<br>

0 Units

</div>

</div>

<div class="section">

<button onclick="printLabels()">

Print Carton Labels

</button>

</div>

</div>


</body>
  
</html>
